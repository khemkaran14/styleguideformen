# The Ultimate Style Guide for Men: Nginx site for __DOMAIN__
# Certbot adds the HTTPS (443) block and the http->https redirect automatically.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 1m;

    # Scripts: always check for a newer version, so updates show up straight away
    location ~ ^/assets/js/ {
        root __APP_DIR__/public;
        add_header Cache-Control "no-cache";
        gzip on;
        gzip_types application/javascript;
    }

    # Photos and try-on layers are served straight from disk
    location /assets/ {
        alias __APP_DIR__/public/assets/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        gzip on;
        gzip_types application/javascript text/css image/svg+xml;
    }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
